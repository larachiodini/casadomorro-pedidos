<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f0df">
  <meta name="description" content="Casa do Morro — Brigadeiros e Alfajores em Jaraguá do Sul, SC.">
  <title>Casa do Morro — Doces</title>
  <style>
    :root{--navy:#062b61;--cream:#f7f0df;--cream2:#fffaf0;--ink:#162235;--shadow:0 14px 35px rgba(6,43,97,.13)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 5%,#fffdf8 0 18%,transparent 42%),linear-gradient(145deg,var(--cream),#efe5ce);display:flex;justify-content:center;padding:28px 16px}
    .page{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .card{width:100%;background:rgba(255,250,240,.78);border:1px solid rgba(6,43,97,.08);border-radius:32px;padding:30px 20px 22px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
    .logo{width:116px;height:116px;border-radius:50%;object-fit:cover;box-shadow:0 8px 22px rgba(6,43,97,.16);border:5px solid var(--cream2);margin-bottom:14px}
    h1{font-size:27px;line-height:1.1;margin:0;color:var(--navy);letter-spacing:-.6px}
    .subtitle{margin:8px 0 4px;font-size:15px;font-weight:650;color:#6d6252}
    .location{font-size:13px;color:#8b7e6c;margin-bottom:24px}
    .buttons{display:grid;gap:13px}
    .btn{display:flex;align-items:center;justify-content:center;gap:11px;min-height:60px;border-radius:18px;text-decoration:none;font-size:16px;font-weight:800;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 7px 18px rgba(6,43,97,.10)}
    .btn:active{transform:scale(.985)}
    .primary{background:var(--navy);color:white}
    .secondary{background:#fffdf8;color:var(--navy);border:1.5px solid rgba(6,43,97,.15)}
    .icon{font-size:22px;line-height:1}
    .note{margin:22px 4px 0;font-size:12px;color:#8a7e6d;line-height:1.5}
    footer{margin-top:16px;font-size:11px;color:#8a7e6d}
    @media (min-width:600px){body{padding-top:50px}.card{padding:38px 32px 28px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <img class="logo" src="logo.png" alt="Logo Casa do Morro">
      <h1>Casa do Morro</h1>
      <div class="subtitle">Brigadeiros • Alfajores</div>
      <div class="location">📍 Jaraguá do Sul, SC</div>

      <div class="buttons">
        <a class="btn primary" href="https://www.ifood.com.br/delivery/jaragua-do-sul-sc/casa-do-morro---doceria-barra-do-rio-molha/9c690c2c-fb16-4618-ab4f-6ea6f0917a13?utm_medium=share" target="_blank" rel="noopener noreferrer">
          <span class="icon"></span> Pedir pelo iFood
        </a>
        <a class="btn secondary" href="https://wa.me/message/E2X6LJ3L5QP5G1" target="_blank" rel="noopener noreferrer">
          <span class="icon"></span> Pedir pelo WhatsApp
        </a>
      </div>

      <p class="note">Escolha onde quer fazer seu pedido 💙</p>
    </section>
    <footer>Casa do Morro · Doces feitos com carinho</footer>
  </main>
</body>
</html>
